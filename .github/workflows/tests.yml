name: MSPress PHP Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests and coding standards
        run: composer check