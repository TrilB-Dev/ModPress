name: Build ModPress Deploy Branch

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Configure Git
        shell: bash
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Delete Deploy branch (if exists)
        shell: bash
        run: git push origin --delete Deploy || true

      - name: Create New Deploy branch
        shell: bash
        run: git checkout -b Deploy master

      - name: Install Node dependencies
        shell: bash
        run: npm install

      - name: Build Node frontend assets
        shell: bash
        run: npm run build

      - name: Add Node changes
        shell: bash
        run: |
          shopt -s globstar
          git add src/**/build/** || true

      - name: Commit Node changes
        shell: bash
        run: |
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Build Node frontend assets"
          fi

      - name: Install Composer production dependencies
        shell: bash
        run: composer install --no-dev --optimize-autoloader

      - name: Add Composer changes
        shell: bash
        run: git add vendor/ composer.lock || true

      - name: Commit composer changes
        shell: bash
        run: |
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Install production dependencies"
          fi

      - name: Push New Deploy branch
        shell: bash
        run: git push origin Deploy

      - name: Checkout Master branch
        shell: bash
        run: git checkout master

      - name: Fetch Deploy branch
        shell: bash
        run: git fetch origin Deploy

      - name: Checkout Deploy branch
        shell: bash
        run: git checkout Deploy

      - name: Remove Root Non Production Folders
        shell: bash
        run: |
          # Force removal of directories
          rm -rf .vscode || true
          rm -rf .github || true
          rm -rf .kiota || true
          rm -rf dev-stubs || true
          rm -rf node_modules || true
          rm -rf Test || true
          rm -rf scripts || true
          rm -rf Docs || true
          rm -rf PluginBackup || true
          
      - name: Remove Root Non Production Files
        shell: bash
        run: |
          # Force removal of files    
          rm -f .deployignore || true
          rm -f .gitignore || true
          rm -f package-lock.json || true
          #rm -f package.json || true
          rm -f phpunit.xml.dist || true
          rm -f phpcs.xml.dist || true
          rm -f webpack.config.js || true
          rm -f .wp-env.json || true

      - name: Add all remaining files
        shell: bash
        run: git add .

      - name: Commit changes
        shell: bash
        run: |
          if git diff --cached --quiet; then
            echo "No deployment cleanup changes to commit"
          else
            git commit -m "Deployment Ready - Remove development files and update to latest Master"
          fi

      - name: Push Deploy
        shell: bash
        run: git push --force origin Deploy